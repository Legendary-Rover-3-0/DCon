name: workflow
on:
    workflow_dispatch:
    pull_request:
        branches: [develop]
    push:
        branches: [develop]

jobs:
    job_1:
        name: Build on Ubuntu
        runs-on: ubuntu-latest
        steps:
            # Pobranie repozytorium
            - name: Checkout
              uses: actions/checkout@v4

            # Instalacja toolchaina ARM
            - name: Install ARM GCC
              uses: ryanwinter/arm-none-eabi-gcc@master
              with:
                release: '10.3-2021.10'

            # Sprawdzenie wersji kompilatora (aby upewnić się, że jest w PATH)
            - name: Check ARM GCC version
              run: arm-none-eabi-gcc --version

            # Czyszczenie starej kompilacji
            - name: Clean
              run: make clean

            # Budowanie całego projektu
            - name: Build
              run: make all

    job_2:
        name: Build on Windows
        runs-on: windows-latest
        needs: job_1
        steps:
            # Pobranie repozytorium
            - name: Checkout
              uses: actions/checkout@v4

            # Instalacja toolchaina ARM
            - name: Install ARM GCC
              uses: ryanwinter/arm-none-eabi-gcc@master
              with:
                release: '10.3-2021.10'

            # Sprawdzenie wersji kompilatora (aby upewnić się, że jest w PATH)
            - name: Check ARM GCC version
              run: arm-none-eabi-gcc --version

            # Czyszczenie starej kompilacji
            - name: Clean
              run: make clean

            # Budowanie całego projektu
            - name: Build
              run: make all
